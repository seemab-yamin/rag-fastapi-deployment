# Edit this file after creating a repo from the template.
# Setup guide: docs/first-time-setup.md

model:
  path: models/yolov8n.onnx      # put your .onnx file here
  url: https://huggingface.co/Kalray/yolov8/resolve/main/yolov8n.onnx  # direct link. CI downloads it to path. Remove if you add the file yourself
  sha256: 65158dad735be799c2466fa15e260c09558080bd530b42a8d0c3d1b419afd8b5  # optional. CI fails if the downloaded file differs. Update it with url
  task: detection              # only "detection" is supported for now
  input_size: [640, 640]       # height, width. Used only if the model input is dynamic
  channel_order: RGB           # RGB or BGR
  normalize: true              # true divides pixel values by 255
  # mean: [0.485, 0.456, 0.406]  # optional per-channel mean, subtracted after normalize (ImageNet values shown)
  # std: [0.229, 0.224, 0.225]   # optional per-channel std, divided after mean
  labels: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light, fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee, skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard, surfboard, tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch, potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard, cell phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors, teddy bear, hair drier, toothbrush]                   # class names in model order, e.g. [person, car]

inference:
  providers: [CPUExecutionProvider]   # GPU: [CUDAExecutionProvider, CPUExecutionProvider]. Missing ones are skipped with a warning; CPU is the fallback
  confidence_threshold: 0.25
  iou_threshold: 0.45
  max_upload_mb: 10            # /predict rejects larger uploads with 413